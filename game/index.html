<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Court — Duel of the Five Lanterns</title>
<style>
  :root {
    --night: #14102e;
    --night-2: #1e1745;
    --felt: #4a2b4d;
    --felt-2: #5d3557;
    --cream: #f7ead0;
    --ink: #2b1d33;
    --gold: #f2c14e;
    --violet: #c77dff;
    --muted: #b9a8d6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--cream);
    background: radial-gradient(1200px 700px at 50% -10%, #2c2358 0%, var(--night) 55%, #0d0a20 100%);
    overflow: hidden;
  }
  #embers { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  #app { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; padding: 10px 22px 8px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 2px 4px 8px; }
  .brand h1 { font-size: 26px; letter-spacing: 2px; color: var(--gold); text-shadow: 0 0 18px rgba(242,193,78,.45); }
  .brand p { font-size: 12px; color: var(--muted); letter-spacing: 1px; font-style: italic; }
  .scoreboard { display: flex; align-items: center; gap: 14px; background: rgba(0,0,0,.35); border: 1px solid rgba(242,193,78,.35); border-radius: 12px; padding: 6px 16px; }
  .score-side { text-align: center; min-width: 74px; }
  .score-side .who { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .score-side .pts { font-size: 30px; font-weight: bold; line-height: 1; }
  .score-side.sable .pts { color: var(--gold); }
  .score-side.vesper .pts { color: var(--violet); }
  .score-mid { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.3; }
  .score-mid b { color: var(--cream); font-size: 13px; }
  #turn-note { font-size: 13px; font-style: italic; color: var(--cream); min-width: 170px; text-align: right; }
  .top-btns { display: flex; gap: 8px; }
  .top-btns button, .big-btn {
    font-family: inherit; cursor: pointer; border-radius: 10px;
    border: 1px solid rgba(242,193,78,.6); background: rgba(242,193,78,.12);
    color: var(--gold); padding: 8px 14px; font-size: 14px;
  }
  .top-btns button:hover, .big-btn:hover { background: rgba(242,193,78,.28); }

  #table {
    flex: 1; display: flex; flex-direction: column; justify-content: space-between;
    background: linear-gradient(180deg, var(--felt-2), var(--felt));
    border: 3px solid #6b3a2e; border-radius: 22px; outline: 1px solid rgba(242,193,78,.25);
    box-shadow: inset 0 0 60px rgba(0,0,0,.45), 0 10px 40px rgba(0,0,0,.5);
    padding: 8px 18px 10px; min-height: 0;
  }
  .hand-label { font-size: 12px; letter-spacing: 1px; color: var(--muted); margin-bottom: 5px; font-style: italic; }
  .hand-row { display: flex; gap: 8px; justify-content: center; min-height: 118px; align-items: flex-start; }
  .hand-row.foe { min-height: 74px; }
  .hand-row.foe .card { width: 56px; height: 72px; }

  /* ---- Cards ---- */
  .card {
    --suit: #e4572e;
    position: relative; width: 92px; height: 128px; flex: 0 0 auto;
    background: linear-gradient(160deg, #fff8e6, var(--cream) 60%, #ecd9ac);
    color: var(--ink); border-radius: 10px; border: 2px solid var(--suit);
    box-shadow: 0 4px 14px rgba(0,0,0,.5); cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .card:hover { transform: translateY(-6px); }
  .card.selected { transform: translateY(-14px); box-shadow: 0 0 0 3px var(--gold), 0 10px 22px rgba(0,0,0,.6); }
  .card.glow { box-shadow: 0 0 18px rgba(242,193,78,.8); }
  .card.dim { opacity: .45; }
  .card-value { font-size: 44px; font-weight: bold; line-height: .9; color: var(--suit); }
  .card-glyph { color: var(--suit); line-height: 0; margin-top: 4px; }
  .card-suit { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--suit); margin-top: 5px; }
  .card-corner { position: absolute; display: flex; flex-direction: column; align-items: center; color: var(--suit); line-height: 1; }
  .card-corner b { font-size: 15px; }
  .card-corner svg { width: 13px; height: 13px; }
  .lantern-slot .card-corner b { font-size: 12px; }
  .lantern-slot .card-corner svg { width: 10px; height: 10px; }
  .card-corner.top { top: 5px; left: 6px; }
  .card-corner.bottom { bottom: 5px; right: 6px; transform: rotate(180deg); }
  .card-badge {
    position: absolute; top: -11px; right: -8px; background: var(--ink); color: var(--gold);
    font-size: 12px; font-weight: bold; border-radius: 20px; padding: 2px 8px;
    border: 1px solid var(--gold); white-space: nowrap; z-index: 2;
  }
  .card.back {
    background: repeating-linear-gradient(45deg, #3a2350 0 8px, #2c1a3e 8px 16px);
    border-color: var(--gold); color: var(--gold); cursor: default;
  }
  .card.back:hover { transform: none; }
  .card-back-glyph { opacity: .9; }
  .card-back-word { font-size: 9px; letter-spacing: 3px; margin-top: 6px; }

  /* ---- Lanterns ---- */
  #lantern-row { display: flex; justify-content: center; gap: 26px; align-items: stretch; }
  .lantern-col { display: flex; flex-direction: column; align-items: center; width: 128px; }
  .lantern-slot { height: 96px; display: flex; align-items: center; justify-content: center; }
  .lantern-slot .card { width: 66px; height: 92px; cursor: default; }
  .lantern-slot .card:hover { transform: none; }
  .lantern-slot .card .card-value { font-size: 30px; }
  .lantern-slot .card .card-glyph svg { width: 26px; height: 26px; }
  .lantern {
    --affinity: #e4572e;
    position: relative; width: 108px; height: 118px; cursor: pointer;
    background: radial-gradient(ellipse at 50% 38%, #fff3c4 0%, #ffd98a 42%, #f0a35e 78%, #c97b3d 100%);
    border-radius: 50% / 46%; border: 3px solid #7a4a22;
    box-shadow: 0 0 26px rgba(255, 190, 90, .55), inset 0 -12px 24px rgba(120, 50, 10, .35);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #4a2410;
  }
  .lantern::before, .lantern::after {
    content: ''; position: absolute; left: 50%; transform: translateX(-50%);
    width: 44px; height: 10px; background: #5d3418; border-radius: 4px;
  }
  .lantern::before { top: -7px; }
  .lantern::after { bottom: -7px; }
  .lantern-roman { font-size: 30px; font-weight: bold; line-height: 1; }
  .lantern-affinity { color: var(--affinity); line-height: 0; margin-top: 4px; filter: drop-shadow(0 0 3px rgba(255,255,255,.7)); }
  .lantern-value { font-size: 12px; font-weight: bold; letter-spacing: 1px; margin-top: 3px; }
  .lantern-owner, .lantern-open { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
  .lantern-col.owned .lantern { box-shadow: 0 0 0 4px var(--gold), 0 0 30px rgba(255,190,90,.7); }
  .lantern-col.owned.by-vesper .lantern { box-shadow: 0 0 0 4px var(--violet), 0 0 30px rgba(199,125,255,.7); }
  .lantern-col.targeted .lantern { box-shadow: 0 0 0 4px #fff, 0 0 34px rgba(255,255,255,.8); }

  #log { min-height: 40px; padding: 6px 4px 0; font-size: 13px; font-style: italic; color: var(--muted); }
  .log-line { line-height: 1.35; }
  footer { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding-top: 4px; }

  /* ---- Overlays ---- */
  #overlay {
    position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
    background: rgba(10, 6, 28, .72); backdrop-filter: blur(2px);
  }
  #overlay.hidden { display: none; }
  .panel {
    width: 640px; max-width: 92vw; text-align: center; padding: 34px 44px 30px;
    background: linear-gradient(180deg, #241b4a, #171130);
    border: 2px solid rgba(242,193,78,.55); border-radius: 20px;
    box-shadow: 0 20px 70px rgba(0,0,0,.7);
  }
  .panel h1 { font-size: 46px; color: var(--gold); letter-spacing: 3px; text-shadow: 0 0 24px rgba(242,193,78,.5); }
  .panel .subtitle { font-size: 18px; font-style: italic; color: var(--cream); margin-top: 2px; letter-spacing: 1px; }
  .panel .versus { margin-top: 12px; font-size: 14px; line-height: 1.6; color: var(--muted); }
  .howto { text-align: left; margin: 18px auto 20px; max-width: 520px; font-size: 14px; line-height: 1.65; color: #e8dcf5; padding-left: 20px; }
  .big-btn { font-size: 18px; padding: 12px 30px; }
  .keys-hint { margin-top: 14px; font-size: 12px; color: var(--muted); font-style: italic; }
  .end-panel.win h1 { color: var(--gold); }
  .end-panel.loss h1 { color: var(--violet); }
  .final-score { font-size: 30px; font-weight: bold; margin-top: 10px; }
  .end-note { margin-top: 8px; font-size: 15px; font-style: italic; color: #e8dcf5; }
  .end-stats { margin: 12px 0 18px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<canvas id="embers"></canvas>
<div id="app">
  <header>
    <div class="brand">
      <h1>EMBER COURT</h1>
      <p>Duel of the Five Lanterns</p>
    </div>
    <div class="scoreboard">
      <div class="score-side sable"><div class="who">Sable</div><div class="pts" id="score-sable">0</div></div>
      <div class="score-mid"><b>First to 7</b><br>lanterns 1 · 2 · 3 · 2 · 1</div>
      <div class="score-side vesper"><div class="who">Vesper</div><div class="pts" id="score-vesper">0</div></div>
    </div>
    <div id="turn-note">Your move — play a card.</div>
    <div class="top-btns">
      <button id="btn-mute" type="button">Sound: on</button>
      <button id="btn-restart" type="button">Restart</button>
    </div>
  </header>

  <div id="table">
    <div id="foe-hand"></div>
    <div id="lantern-row"></div>
    <div id="player-hand"></div>
  </div>

  <div id="log"></div>
  <footer>
    <span>Click a card, then a lantern — or keys 1–7, ← →, Enter.</span>
    <span>Kindle = value +2 affinity +4 First Light · brighter suit breaks ties</span>
  </footer>
</div>
<div id="overlay"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
